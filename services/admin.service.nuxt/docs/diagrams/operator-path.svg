<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" font-family="Inter, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1A1A1A; }
      .label { font-size: 15px; font-weight: 600; fill: #1A1A1A; }
      .text  { font-size: 14px; }
      .muted { font-size: 12px; fill: #6B6B6B; }
      .mono  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px; }
      .name  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 14px; font-weight: 700; fill: #1A1A1A; }
      .step circle { fill: #fff; stroke: #2F6FE0; stroke-width: 1.8; }
      .step text { font-size: 12px; font-weight: 700; fill: #1A1A1A; text-anchor: middle; dominant-baseline: central; }
      .plate { fill: #E6EEFC; }
      .key { fill: #FFF0D4; }
      .tag rect { fill: #F1F1F1; } .tag text { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #444; }
    </style>
  </defs>
  <rect width="1200" height="590" fill="#FFFFFF"/>
  <text x="40" y="44" class="title">Путь оператора: от входа до спора по сделке</text>

  <g transform="translate(40,80)">
    <rect width="170" height="470" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect width="170" height="18" fill="#1A1A1A"/>
    <circle cx="12" cy="9" r="3" fill="#fff"/><circle cx="22" cy="9" r="3" fill="#fff"/><circle cx="32" cy="9" r="3" fill="#fff"/>
    <circle cx="85" cy="70" r="28" fill="#fff" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="85" cy="62" r="9" fill="#1A1A1A"/><path d="M66 90 Q85 70 104 90" fill="#1A1A1A"/>
    <text x="85" y="128" class="label" text-anchor="middle">Браузер</text>
    <text x="85" y="147" class="label" text-anchor="middle">оператора</text>
    <text x="85" y="180" class="muted" text-anchor="middle">SPA, ssr: false</text>
    <g class="tag" transform="translate(20,210)"><rect width="130" height="22" rx="3"/><text x="8" y="15">nuxt-session</text></g>
    <text x="85" y="300" class="muted" text-anchor="middle">JWT браузер</text>
    <text x="85" y="318" class="muted" text-anchor="middle">не видит</text>
    <g class="tag" transform="translate(20,240)"><rect width="130" height="22" rx="3"/><text x="8" y="15">csrf-token</text></g>
  </g>

  <rect x="330" y="70" width="470" height="480" rx="6" fill="#FFFFFF" stroke="#F6821F" stroke-width="2.5"/>
  <text x="780" y="96" class="muted" text-anchor="end">admin.service.nuxt · Nitro</text>

  <g class="step" transform="translate(356,122)"><circle r="11"/><text>1</text></g>
  <text x="376" y="127" class="label">Вход по токену и коду TOTP</text>
  <rect x="350" y="140" width="430" height="54" class="plate"/>
  <text x="362" y="161" class="mono" fill="#1A1A1A">POST /api/auth/login</text>
  <text x="362" y="183" class="mono" fill="#1A1A1A">POST /api/auth/2fa/verify</text>

  <g class="step" transform="translate(356,232)"><circle r="11"/><text>2</text></g>
  <text x="376" y="237" class="label">Список сделок, опрос каждые 5 с</text>
  <rect x="350" y="250" width="430" height="54" class="plate"/>
  <text x="362" y="271" class="mono" fill="#1A1A1A">GET /api/deals?quick_filter=active</text>
  <text x="362" y="293" class="text" fill="#1A1A1A">мерчанту → /merchant/deals</text>

  <g class="step" transform="translate(356,342)"><circle r="11"/><text>3</text></g>
  <text x="376" y="347" class="label">Карточка сделки</text>
  <rect x="350" y="360" width="430" height="54" class="plate"/>
  <text x="362" y="381" class="mono" fill="#1A1A1A">GET /api/deals/:id</text>
  <text x="362" y="403" class="mono" fill="#1A1A1A">GET /api/deals/:id/events</text>

  <g class="step" transform="translate(356,452)"><circle r="11"/><text>4</text></g>
  <text x="376" y="457" class="label">Открыть или закрыть спор</text>
  <rect x="350" y="470" width="430" height="54" class="key"/>
  <text x="362" y="491" class="mono" fill="#C25E00">POST /api/deals/:id/dispute</text>
  <text x="362" y="513" class="mono" fill="#C25E00">POST /api/deals/:id/dispute/resolve</text>

  <line x1="210" y1="156" x2="322" y2="156" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="330" y1="184" x2="218" y2="184" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="244" y="204" class="muted">Set-Cookie</text>
  <line x1="210" y1="266" x2="322" y2="266" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="330" y1="294" x2="218" y2="294" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="210" y1="376" x2="322" y2="376" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="330" y1="404" x2="218" y2="404" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="210" y1="486" x2="322" y2="486" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="330" y1="514" x2="218" y2="514" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <text x="806" y="141" class="mono" fill="#1A1A1A">/auth/login</text>
  <line x1="800" y1="156" x2="892" y2="156" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="900" y1="184" x2="808" y2="184" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="828" y="204" class="muted">JWT-пара</text>
  <text x="806" y="258" class="muted">+ Bearer</text>
  <line x1="800" y1="266" x2="892" y2="266" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="900" y1="294" x2="808" y2="294" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="800" y1="376" x2="892" y2="376" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="900" y1="404" x2="808" y2="404" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="800" y1="486" x2="892" y2="486" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="900" y1="514" x2="808" y2="514" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <rect x="900" y="70" width="260" height="480" rx="6" fill="#FFF6EA" stroke="#F6821F" stroke-width="2.5"/>
  <text x="920" y="100" class="name">admin-api</text>
  <text x="920" y="120" class="muted">core.service.go</text>
  <text x="920" y="232" class="text" fill="#1A1A1A">проверяет JWT и роль</text>
  <text x="920" y="342" class="text" fill="#1A1A1A">мерчант видит только</text>
  <text x="920" y="362" class="text" fill="#1A1A1A">свои сделки</text>
  <text x="920" y="452" class="text" fill="#1A1A1A">двигает деньги</text>
  <text x="920" y="472" class="text" fill="#1A1A1A">в леджере</text>
</svg>
