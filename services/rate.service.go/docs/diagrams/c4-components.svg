<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1A1A1A; }
      .label { font-size: 15px; font-weight: 600; fill: #1A1A1A; }
      .text  { font-size: 13px; fill: #1A1A1A; }
      .muted { font-size: 12px; fill: #6B6B6B; }
      .proto { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #6B6B6B; }
      .pkg   { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 12px; font-weight: 700; fill: #1A1A1A; }
      .comp  { fill: #FFFFFF; stroke: #F6821F; stroke-width: 1; }
      .store { fill: #F1F1F1; }
      .svc   { fill: #E6EEFC; stroke: #2F6FE0; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="40" y="44" class="title">Компоненты rate.service.go</text>

  <rect x="300" y="80" width="860" height="440" rx="6" fill="#FFFFFF" stroke="#F6821F" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="320" y="106" class="pkg">rate.service.go</text>
  <text x="442" y="106" class="muted">[Go-сервис]</text>

  <rect x="40" y="120" width="170" height="84" rx="4" class="svc"/>
  <text x="56" y="152" class="pkg">core.service.go</text>
  <text x="56" y="172" class="muted">[Go-сервис]</text>
  <text x="56" y="192" class="text">сделки и админка</text>
  <line x1="210" y1="162" x2="452" y2="162" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="316" y="148" class="text">спрашивает курс</text>
  <text x="316" y="182" class="proto">[CQRS Rate.*]</text>

  <rect x="460" y="120" width="240" height="84" class="comp"/>
  <text x="474" y="144" class="pkg">controller/nats_rpc/v1</text>
  <text x="474" y="164" class="muted">[NATS-контроллер]</text>
  <text x="474" y="186" class="text">5 обработчиков, валидация</text>

  <rect x="860" y="120" width="240" height="84" class="comp"/>
  <text x="874" y="144" class="pkg">usecase/warmer</text>
  <text x="874" y="164" class="muted">[фоновая задача]</text>
  <text x="874" y="186" class="text">прогрев раз в 25 с, алерты</text>

  <line x1="580" y1="204" x2="580" y2="242" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a-ink)"/>

  <rect x="460" y="250" width="240" height="84" class="comp"/>
  <text x="474" y="274" class="pkg">usecase/rate</text>
  <text x="474" y="294" class="muted">[usecase]</text>
  <text x="474" y="316" class="text">курс, курс сделки, ручные курсы</text>

  <line x1="480" y1="334" x2="480" y2="392" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a-ink)"/>
  <line x1="640" y1="334" x2="640" y2="392" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a-ink)"/>
  <path d="M700 300 H800 V392" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a-ink)"/>
  <path d="M880 204 V360 H700 V392" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a-ink)"/>
  <path d="M700 360 H510 V392" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a-ink)"/>
  <line x1="920" y1="204" x2="920" y2="392" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a-ink)"/>
  <line x1="1060" y1="204" x2="1060" y2="392" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#a-ink)"/>

  <rect x="320" y="400" width="210" height="84" class="comp"/>
  <text x="334" y="424" class="pkg">repo/persistent/postgres</text>
  <text x="334" y="444" class="muted">[репозиторий]</text>
  <text x="334" y="466" class="text">пары и последний курс</text>

  <rect x="545" y="400" width="190" height="84" class="comp"/>
  <text x="559" y="424" class="pkg">repo/persistent/cache</text>
  <text x="559" y="444" class="muted">[кэш]</text>
  <text x="559" y="466" class="text">курсы 30 с, пары 5 мин</text>

  <rect x="750" y="400" width="190" height="84" class="comp"/>
  <text x="764" y="424" class="pkg">repo/webapi/exchange</text>
  <text x="764" y="444" class="muted">[адаптеры бирж]</text>
  <text x="764" y="466" class="text">реестр и breaker</text>

  <rect x="955" y="400" width="185" height="84" class="comp"/>
  <text x="969" y="424" class="pkg">repo/publisher</text>
  <text x="969" y="444" class="muted">[публикатор]</text>
  <text x="969" y="466" class="text">события и алерты</text>

  <line x1="420" y1="484" x2="420" y2="612" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="430" y="560" class="text">хранит</text>
  <text x="430" y="578" class="proto">[SQL]</text>
  <line x1="600" y1="484" x2="600" y2="612" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="610" y="560" class="text">кэширует</text>
  <text x="610" y="578" class="proto">[Redis]</text>
  <line x1="800" y1="484" x2="800" y2="612" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="810" y="560" class="text">берёт курс</text>
  <text x="810" y="578" class="proto">[HTTPS]</text>
  <line x1="990" y1="484" x2="990" y2="612" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="1000" y="560" class="text">публикует</text>
  <text x="1000" y="578" class="proto">[JetStream, CQRS]</text>

  <rect x="340" y="620" width="160" height="56" rx="4" class="store"/>
  <text x="356" y="653" class="label">PostgreSQL</text>
  <rect x="540" y="620" width="140" height="56" rx="4" class="store"/>
  <text x="556" y="653" class="label">Redis</text>
  <rect x="720" y="620" width="200" height="56" rx="4" class="svc"/>
  <text x="734" y="644" class="label">Биржи</text>
  <text x="734" y="664" class="muted">публичные и merchant API</text>
  <rect x="950" y="620" width="210" height="56" rx="4" class="store"/>
  <text x="966" y="644" class="label">NATS</text>
  <text x="966" y="664" class="muted">rate.updated, System.TechAlert</text>
</svg>
