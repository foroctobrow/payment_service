<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Inter, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#2F6FE0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1A1A1A; }
      .label { font-size: 15px; font-weight: 600; fill: #1A1A1A; }
      .text  { font-size: 14px; }
      .muted { font-size: 12px; fill: #6B6B6B; }
      .mono  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px; }
      .step circle { fill: #fff; stroke: #2F6FE0; stroke-width: 1.8; }
      .step text { font-size: 12px; font-weight: 700; fill: #1A1A1A; text-anchor: middle; dominant-baseline: central; }
      .plate { fill: #E6EEFC; }
      .key { fill: #FFF0D4; }
      .store { fill: #F1F1F1; }
    </style>
  </defs>
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <text x="40" y="44" class="title">Откуда берётся курс RUB → USDT для сделки</text>

  <g transform="translate(40,90)">
    <rect width="170" height="110" fill="#FFF6EA" stroke="#F6821F" stroke-width="2.5"/>
    <rect width="170" height="18" fill="#F6821F"/>
    <circle cx="12" cy="9" r="3" fill="#fff"/><circle cx="22" cy="9" r="3" fill="#fff"/><circle cx="32" cy="9" r="3" fill="#fff"/>
    <text x="14" y="50" class="label">core</text>
    <text x="14" y="72" class="muted">создание сделки</text>
  </g>
  <g class="step" transform="translate(52,232)"><circle r="11"/><text>1</text></g>
  <text x="40" y="266" class="mono" fill="#1A1A1A">Rate.GetDealRate</text>
  <text x="40" y="286" class="mono" fill="#1A1A1A">fiatCurrency: RUB</text>
  <text x="40" y="306" class="mono" fill="#1A1A1A">adapterSlug: ""</text>
  <line x1="210" y1="130" x2="292" y2="130" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="300" y1="170" x2="218" y2="170" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="40" y="350" class="mono" fill="#1A1A1A">providerRate:</text>
  <text x="40" y="370" class="mono" fill="#1A1A1A">"100"</text>

  <rect x="300" y="70" width="600" height="570" rx="6" fill="#FFFFFF" stroke="#F6821F" stroke-width="2.5"/>
  <text x="880" y="96" class="muted" text-anchor="end">rate</text>

  <g class="step" transform="translate(326,110)"><circle r="11"/><text>2</text></g>
  <text x="346" y="115" class="label">Находим адаптер пары</text>
  <rect x="320" y="128" width="440" height="52" class="plate"/>
  <text x="332" y="150" class="mono" fill="#1A1A1A">RUB → USDT, is_default, is_active</text>
  <text x="332" y="170" class="mono" fill="#1A1A1A">adapter_slug = rapira</text>
  <text x="512" y="170" class="text" fill="#1A1A1A">пара кэшируется на 5 мин</text>

  <g class="step" transform="translate(326,214)"><circle r="11"/><text>3</text></g>
  <text x="346" y="219" class="label">Берём курс из кэша</text>
  <rect x="320" y="232" width="440" height="52" class="key"/>
  <text x="332" y="254" class="mono" fill="#C25E00">rate_source:rapira</text>
  <text x="490" y="254" class="text" fill="#C25E00">живёт 30 с</text>
  <text x="332" y="274" class="text" fill="#C25E00">осталось меньше 5 с — обновляем в фоне</text>

  <g class="step" transform="translate(326,318)"><circle r="11"/><text>4</text></g>
  <text x="346" y="323" class="label">Кэш пуст — один запрос к бирже</text>
  <rect x="320" y="336" width="440" height="52" class="plate"/>
  <text x="332" y="358" class="text" fill="#1A1A1A">singleflight на slug, circuit breaker:</text>
  <text x="332" y="378" class="text" fill="#1A1A1A">5 сбоев подряд — пауза 30 с</text>

  <g class="step" transform="translate(326,422)"><circle r="11"/><text>5</text></g>
  <text x="346" y="427" class="label">Биржа не ответила — последний курс</text>
  <rect x="320" y="440" width="440" height="52" class="plate"/>
  <text x="332" y="462" class="mono" fill="#1A1A1A">rate_pairs.current_rate</text>
  <text x="332" y="482" class="text" fill="#1A1A1A">не старше 15 мин, иначе</text>
  <text x="500" y="482" class="mono" fill="#1A1A1A">RATE_STALE</text>

  <line x1="320" y1="520" x2="880" y2="520" stroke="#D9D9D9" stroke-width="1"/>
  <text x="320" y="548" class="label">В фоне: прогрев каждые 25 с</text>
  <rect x="320" y="562" width="560" height="56" class="plate"/>
  <text x="332" y="584" class="text" fill="#1A1A1A">все активные пары → биржа → кэш на 30 с,</text>
  <text x="332" y="604" class="mono" fill="#1A1A1A">current_rate, rate.updated.&lt;slug&gt;</text>

  <rect x="980" y="110" width="180" height="70" rx="4" class="store"/>
  <text x="996" y="140" class="label">PostgreSQL</text>
  <text x="996" y="162" class="muted">rate_pairs</text>
  <line x1="760" y1="154" x2="972" y2="154" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <rect x="980" y="222" width="180" height="70" rx="4" class="store"/>
  <text x="996" y="252" class="label">Redis</text>
  <text x="996" y="274" class="muted">кэш курсов и пар</text>
  <line x1="760" y1="258" x2="972" y2="258" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <g transform="translate(980,330)">
    <rect width="180" height="100" fill="#E6EEFC" stroke="#2F6FE0" stroke-width="2.5"/>
    <rect width="180" height="18" fill="#2F6FE0"/>
    <circle cx="12" cy="9" r="3" fill="#fff"/><circle cx="22" cy="9" r="3" fill="#fff"/><circle cx="32" cy="9" r="3" fill="#fff"/>
    <text x="16" y="50" class="label">Биржа</text>
    <text x="16" y="72" class="muted">адаптер rapira</text>
  </g>
  <line x1="760" y1="352" x2="972" y2="352" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="980" y1="384" x2="768" y2="384" stroke="#2F6FE0" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="962" y="372" class="text" fill="#2F6FE0" text-anchor="end">askPrice</text>
  <path d="M880 590 H1070 V438" fill="none" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
</svg>
