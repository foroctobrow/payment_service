<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-purple" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#9A1FC0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-orange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#F6821F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1A1A1A; }
      .label { font-size: 15px; font-weight: 600; fill: #1A1A1A; }
      .text  { font-size: 14px; }
      .muted { font-size: 12px; fill: #6B6B6B; }
      .mono  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px; }
      .name  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 14px; font-weight: 700; fill: #1A1A1A; }
      .step circle { fill: #fff; stroke: #2F6FE0; stroke-width: 1.8; }
      .step text { font-size: 12px; font-weight: 700; fill: #1A1A1A; text-anchor: middle; dominant-baseline: central; }
      .plate { fill: #E6EEFC; }
      .key { fill: #FFF0D4; }
      .tag rect { fill: #F1F1F1; } .tag text { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #444; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="44" class="title">Webhook мерчанту: от сохранения сделки до записи в историю</text>

  <rect x="40" y="90" width="170" height="110" rx="6" fill="#FFF6EA" stroke="#F6821F" stroke-width="2.5"/>
  <text x="56" y="120" class="name">core.service.go</text>
  <text x="56" y="144" class="muted">сохраняет сделку</text>
  <text x="56" y="162" class="muted">и публикует событие</text>

  <g class="step" transform="translate(236,112)"><circle r="11"/><text>1</text></g>
  <text x="254" y="117" class="mono" fill="#C25E00">DealEvent</text>
  <line x1="210" y1="140" x2="372" y2="140" stroke="#F6821F" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="228" y="162" class="muted">JetStream DEAL_EVENTS</text>

  <rect x="380" y="70" width="480" height="540" rx="6" fill="#FFFFFF" stroke="#F6821F" stroke-width="2.5"/>
  <text x="840" y="96" class="muted" text-anchor="end">notification.service.go</text>

  <g class="step" transform="translate(406,112)"><circle r="11"/><text>2</text></g>
  <text x="426" y="117" class="label">Оставляем три статуса</text>
  <rect x="400" y="130" width="310" height="34" class="plate"/>
  <text x="412" y="152" class="mono" fill="#1A1A1A">COMPLETED | CANCELED | DISPUTE</text>

  <g class="step" transform="translate(406,198)"><circle r="11"/><text>3</text></g>
  <text x="426" y="203" class="label">Резервируем ключ доставки</text>
  <rect x="400" y="216" width="310" height="52" class="plate"/>
  <text x="412" y="238" class="mono" fill="#1A1A1A">SET NX wh:reserve:… 7m</text>
  <text x="412" y="258" class="text" fill="#1A1A1A">есть wh:sent — пропускаем</text>
  <g class="tag" transform="translate(750,228)"><rect width="84" height="26" rx="4"/><text x="42" y="17" text-anchor="middle">Redis</text></g>
  <line x1="710" y1="241" x2="750" y2="241" stroke="#B0B0B0" stroke-width="1.2"/>

  <g class="step" transform="translate(406,302)"><circle r="11"/><text>4</text></g>
  <text x="426" y="307" class="label">Записываем попытку</text>
  <rect x="400" y="320" width="310" height="34" class="plate"/>
  <text x="412" y="342" class="mono" fill="#1A1A1A">webhook_deliveries: PENDING</text>
  <g class="tag" transform="translate(750,324)"><rect width="84" height="26" rx="4"/><text x="42" y="17" text-anchor="middle">PostgreSQL</text></g>
  <line x1="710" y1="337" x2="750" y2="337" stroke="#B0B0B0" stroke-width="1.2"/>

  <g class="step" transform="translate(406,388)"><circle r="11"/><text>5</text></g>
  <text x="426" y="393" class="label">Отправляем мерчанту</text>
  <rect x="400" y="406" width="310" height="52" class="plate"/>
  <text x="412" y="428" class="mono" fill="#1A1A1A">POST notification_url</text>
  <text x="412" y="448" class="text" fill="#1A1A1A">таймаут 15 с, breaker на хост</text>

  <g class="step" transform="translate(406,492)"><circle r="11"/><text>6</text></g>
  <text x="426" y="497" class="label">Фиксируем результат</text>
  <rect x="400" y="510" width="310" height="80" class="key"/>
  <text x="412" y="532" class="mono" fill="#C25E00">2xx → OK, wh:sent 24h</text>
  <text x="412" y="554" class="text" fill="#C25E00">подтверждаем сообщение (ack)</text>
  <text x="412" y="578" class="text" fill="#1A1A1A">сбой — FAIL, повтор через 5–120 с</text>

  <g transform="translate(960,360)">
    <rect width="190" height="130" fill="#F3DDF7" stroke="#9A1FC0" stroke-width="2.5"/>
    <rect width="190" height="18" fill="#9A1FC0"/>
    <circle cx="12" cy="9" r="3" fill="#fff"/><circle cx="22" cy="9" r="3" fill="#fff"/><circle cx="32" cy="9" r="3" fill="#fff"/>
    <text x="14" y="50" class="mono" fill="#1A1A1A">notificationType:</text>
    <text x="14" y="70" class="mono" fill="#1A1A1A">  "deal"</text>
    <text x="14" y="90" class="mono" fill="#1A1A1A">deal: {…}</text>
  </g>
  <text x="1055" y="514" class="label" text-anchor="middle">Мерчант</text>
  <line x1="710" y1="422" x2="952" y2="422" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="726" y="412" class="muted">X-Webhook-Token</text>
  <line x1="960" y1="444" x2="718" y2="444" stroke="#9A1FC0" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="880" y="464" class="mono" fill="#9A1FC0">200 OK</text>

  <path d="M380 538 H125 V208" fill="none" stroke="#F6821F" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <g class="step" transform="translate(152,506)"><circle r="11"/><text>7</text></g>
  <text x="170" y="511" class="mono" fill="#C25E00">notifications.deal.result</text>
  <text x="140" y="560" class="muted">core пишет MerchantNotified</text>
  <text x="140" y="576" class="muted">в историю сделки</text>
</svg>
