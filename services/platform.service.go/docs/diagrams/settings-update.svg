<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 714" font-family="Inter, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1A1A1A; }
      .label { font-size: 15px; font-weight: 600; fill: #1A1A1A; }
      .text  { font-size: 14px; }
      .muted { font-size: 12px; fill: #6B6B6B; }
      .mono  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px; }
      .name  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 14px; font-weight: 700; fill: #1A1A1A; }
      .step circle { fill: #fff; stroke: #2F6FE0; stroke-width: 1.8; }
      .step text { font-size: 12px; font-weight: 700; fill: #1A1A1A; text-anchor: middle; dominant-baseline: central; }
      .plate { fill: #E6EEFC; }
      .key { fill: #FFF0D4; }
      .tag rect { fill: #F1F1F1; } .tag text { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #444; }
    </style>
  </defs>
  <rect width="1200" height="714" fill="#FFFFFF"/>
  <text x="40" y="44" class="title">Оператор меняет комиссию за вывод</text>

  <g transform="translate(40,72)">
    <rect width="190" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <rect width="190" height="18" fill="#1A1A1A"/>
    <circle cx="12" cy="9" r="3" fill="#fff"/><circle cx="22" cy="9" r="3" fill="#fff"/><circle cx="32" cy="9" r="3" fill="#fff"/>
    <text x="16" y="50" class="text">Админка</text>
  </g>
  <line x1="135" y1="142" x2="135" y2="182" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <g transform="translate(40,190)">
    <rect width="190" height="494" fill="#FFF6EA" stroke="#F6821F" stroke-width="2.5"/>
    <rect width="190" height="18" fill="#F6821F"/>
    <circle cx="12" cy="9" r="3" fill="#fff"/><circle cx="22" cy="9" r="3" fill="#fff"/><circle cx="32" cy="9" r="3" fill="#fff"/>
    <text x="16" y="46" class="name">core.service.go</text>
    <text x="16" y="66" class="muted">admin-api</text>
  </g>

  <rect x="300" y="72" width="620" height="612" rx="6" fill="#FFF6EA" stroke="#F6821F" stroke-width="2.5"/>
  <text x="324" y="104" class="name">platform-service</text>

  <g class="step" transform="translate(336,142)"><circle r="11"/><text>1</text></g>
  <text x="356" y="147" class="label">Запрос на изменение</text>
  <rect x="324" y="160" width="572" height="58" class="plate"/>
  <text x="338" y="183" class="mono" fill="#1A1A1A">Platform.Settings.Update</text>
  <text x="338" y="205" class="mono" fill="#1A1A1A">{"key":"withdrawal_fee","value":"5.00","actorId":…}</text>
  <line x1="230" y1="200" x2="316" y2="200" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <g class="step" transform="translate(336,252)"><circle r="11"/><text>2</text></g>
  <text x="356" y="257" class="label">Проверяем и обновляем строку</text>
  <rect x="324" y="270" width="440" height="58" class="plate"/>
  <text x="338" y="293" class="mono" fill="#1A1A1A">UPDATE platform_settings</text>
  <text x="338" y="315" class="mono" fill="#1A1A1A">WHERE key = 'withdrawal_fee'</text>
  <g class="tag" transform="translate(780,288)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g>
  <text x="324" y="350" class="muted">нет ключа — NOT_FOUND, пустое значение — VALIDATION_ERROR</text>

  <g class="step" transform="translate(336,386)"><circle r="11"/><text>3</text></g>
  <text x="356" y="391" class="label">Сбрасываем кеш настроек</text>
  <rect x="324" y="404" width="440" height="34" class="plate"/>
  <text x="338" y="426" class="mono" fill="#1A1A1A">SCAN + UNLINK platform:settings:*</text>
  <g class="tag" transform="translate(780,410)"><rect width="52" height="22" rx="3"/><text x="8" y="15">Redis</text></g>

  <g class="step" transform="translate(336,472)"><circle r="11"/><text>4</text></g>
  <text x="356" y="477" class="label">Публикуем аудит</text>
  <rect x="324" y="490" width="440" height="58" class="plate"/>
  <text x="338" y="513" class="mono" fill="#1A1A1A">Emit Audit.Event, Broadcast</text>
  <text x="338" y="535" class="mono" fill="#1A1A1A">platform.setting.updated</text>
  <line x1="764" y1="519" x2="952" y2="519" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="316" y1="564" x2="238" y2="564" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="222" y="556" class="muted" text-anchor="end">ответ: 5.00</text>

  <g class="step" transform="translate(336,590)"><circle r="11"/><text>5</text></g>
  <text x="356" y="595" class="label">Следующее чтение</text>
  <rect x="324" y="608" width="572" height="58" class="key"/>
  <text x="338" y="631" class="mono" fill="#C25E00">Platform.Settings.Get {"key":"withdrawal_fee"}</text>
  <text x="338" y="653" class="text" fill="#C25E00">кеш пуст, значение 5.00 читаем из PostgreSQL</text>
  <text x="222" y="616" class="muted" text-anchor="end">заявка на вывод</text>
  <line x1="230" y1="624" x2="316" y2="624" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="316" y1="654" x2="238" y2="654" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <g transform="translate(960,464)">
    <rect width="200" height="100" fill="#FFF6EA" stroke="#F6821F" stroke-width="2.5"/>
    <rect width="200" height="18" fill="#F6821F"/>
    <circle cx="12" cy="9" r="3" fill="#fff"/><circle cx="22" cy="9" r="3" fill="#fff"/><circle cx="32" cy="9" r="3" fill="#fff"/>
    <text x="16" y="46" class="name">account-service</text>
    <text x="16" y="70" class="text">пишет запись</text>
    <text x="16" y="88" class="text">в журнал аудита</text>
  </g>
</svg>
