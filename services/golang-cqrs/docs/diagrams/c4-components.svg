<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" font-family="Inter, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1A1A1A; }
      .text  { font-size: 13px; }
      .muted { font-size: 12px; fill: #6B6B6B; }
      .proto { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #6B6B6B; }
      .name  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px; font-weight: 700; fill: #1A1A1A; }
      .comp  { fill: #FFFFFF; stroke: #F6821F; stroke-width: 1; }
      .ext   { fill: #E6EEFC; stroke: #2F6FE0; stroke-width: 1.5; }
      .store { fill: #F1F1F1; }
    </style>
  </defs>
  <rect width="1500" height="820" fill="#FFFFFF"/>
  <text x="40" y="44" class="title">Компоненты golang-cqrs</text>

  <rect x="40" y="110" width="160" height="660" class="ext"/>
  <text x="52" y="132" class="name">код сервиса</text>
  <text x="52" y="150" class="muted">[Go-сервис платформы]</text>

  <rect x="330" y="72" width="840" height="728" rx="6" fill="#FFF6EA" stroke="#F6821F" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="350" y="102" class="name">golang-cqrs</text>
  <text x="448" y="102" class="muted">[Go-библиотека]</text>

  <rect x="350" y="110" width="230" height="72" class="comp"/>
  <text x="362" y="132" class="name">router.go</text>
  <text x="362" y="150" class="muted">[публичный API]</text>
  <text x="362" y="168" class="text" fill="#1A1A1A">регистрация обработчиков</text>

  <rect x="350" y="230" width="230" height="72" class="comp"/>
  <text x="362" y="252" class="name">service_client.go</text>
  <text x="362" y="270" class="muted">[публичный API]</text>
  <text x="362" y="288" class="text" fill="#1A1A1A">вызов по имени сервиса</text>

  <rect x="350" y="350" width="230" height="72" class="comp"/>
  <text x="362" y="372" class="name">middleware</text>
  <text x="362" y="390" class="muted">[обёртки]</text>
  <text x="362" y="408" class="text" fill="#1A1A1A">трассы, логи, паники</text>

  <rect x="350" y="690" width="230" height="72" class="comp"/>
  <text x="362" y="712" class="name">jetstream_publisher.go</text>
  <text x="362" y="730" class="muted">[публичный API]</text>
  <text x="362" y="748" class="text" fill="#1A1A1A">публикация без Listen</text>

  <line x1="200" y1="146" x2="342" y2="146" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="265" y="138" class="text" fill="#1A1A1A" text-anchor="middle">регистрирует</text>
  <text x="265" y="164" class="proto" text-anchor="middle">[Add*]</text>
  <line x1="200" y1="266" x2="342" y2="266" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="265" y="258" class="text" fill="#1A1A1A" text-anchor="middle">вызывает</text>
  <text x="265" y="284" class="proto" text-anchor="middle">[Query, Call]</text>
  <line x1="200" y1="386" x2="342" y2="386" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="265" y="378" class="text" fill="#1A1A1A" text-anchor="middle">оборачивает</text>
  <text x="265" y="404" class="proto" text-anchor="middle">[With*]</text>
  <line x1="200" y1="726" x2="342" y2="726" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="265" y="718" class="text" fill="#1A1A1A" text-anchor="middle">публикует</text>
  <text x="265" y="744" class="proto" text-anchor="middle">[PublishEvent]</text>

  <rect x="700" y="230" width="160" height="422" class="comp"/>
  <text x="712" y="252" class="name">client.go</text>
  <text x="712" y="270" class="muted">[ядро]</text>
  <text x="712" y="290" class="text" fill="#1A1A1A">Query, Call, Emit,</text>
  <text x="712" y="308" class="text" fill="#1A1A1A">Listen, пул воркеров</text>

  <path d="M580 146 H780 V222" fill="none" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="592" y="138" class="text" fill="#1A1A1A">передаёт маршруты</text>
  <line x1="580" y1="266" x2="692" y2="266" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="636" y="258" class="text" fill="#1A1A1A" text-anchor="middle">делегирует</text>

  <rect x="980" y="230" width="170" height="72" class="comp"/>
  <text x="992" y="252" class="name">discovery</text>
  <text x="992" y="270" class="muted">[internal]</text>
  <text x="992" y="288" class="text" fill="#1A1A1A">таблица узлов</text>

  <rect x="980" y="350" width="170" height="72" class="comp"/>
  <text x="992" y="372" class="name">response-storage</text>
  <text x="992" y="390" class="muted">[internal]</text>
  <text x="992" y="408" class="text" fill="#1A1A1A">ожидания ответов</text>

  <rect x="980" y="480" width="170" height="72" class="comp"/>
  <text x="992" y="502" class="name">broker/broker.go</text>
  <text x="992" y="520" class="muted">[internal]</text>
  <text x="992" y="538" class="text" fill="#1A1A1A">subjects, подписки</text>

  <rect x="980" y="580" width="170" height="72" class="comp"/>
  <text x="992" y="602" class="name">broker/jetstream_*</text>
  <text x="992" y="620" class="muted">[internal]</text>
  <text x="992" y="638" class="text" fill="#1A1A1A">consumer, повтор, DLQ</text>

  <line x1="860" y1="266" x2="972" y2="266" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="916" y="258" class="text" fill="#1A1A1A" text-anchor="middle">ищет узел</text>
  <line x1="860" y1="386" x2="972" y2="386" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="916" y="378" class="text" fill="#1A1A1A" text-anchor="middle">ждёт ответ</text>
  <line x1="860" y1="516" x2="972" y2="516" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="916" y="508" class="text" fill="#1A1A1A" text-anchor="middle">отправляет</text>
  <line x1="860" y1="616" x2="972" y2="616" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="916" y="608" class="text" fill="#1A1A1A" text-anchor="middle">подписывает</text>

  <line x1="1130" y1="480" x2="1130" y2="430" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="1046" y="446" class="muted" text-anchor="middle">ответы в обход воркеров</text>

  <rect x="1310" y="480" width="170" height="72" rx="4" class="store"/>
  <text x="1322" y="506" class="name" style="fill:#444">NATS</text>
  <text x="1322" y="526" class="muted">pub/sub</text>
  <rect x="1310" y="580" width="170" height="72" rx="4" class="store"/>
  <text x="1322" y="606" class="name" style="fill:#444">NATS JetStream</text>
  <text x="1322" y="626" class="muted">streams, consumers</text>

  <line x1="1150" y1="516" x2="1302" y2="516" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="1226" y="508" class="text" fill="#1A1A1A" text-anchor="middle">шлёт, слушает</text>
  <text x="1226" y="534" class="proto" text-anchor="middle">[NATS]</text>
  <line x1="1150" y1="616" x2="1302" y2="616" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="1226" y="608" class="text" fill="#1A1A1A" text-anchor="middle">Ack, Nak, в DLQ</text>
  <text x="1226" y="634" class="proto" text-anchor="middle">[JetStream]</text>

  <path d="M580 726 H1395 V660" fill="none" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="1000" y="718" class="text" fill="#1A1A1A" text-anchor="middle">публикует с Nats-Msg-Id и traceparent</text>
  <text x="1000" y="744" class="proto" text-anchor="middle">[JetStream]</text>
</svg>
