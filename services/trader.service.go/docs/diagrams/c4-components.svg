  <line x1="248" y1="452" x2="402" y2="452" stroke="#2F6FE0" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="256" y="440" class="text" fill="#2F6FE0">жмёт кнопки</text>
  <text x="256" y="472" class="proto">[Telegram Bot API]</text>

  <g transform="translate(1340,122)"><rect width="180" height="60" rx="4" class="store"/>
    <text x="14" y="26" class="svc">PostgreSQL</text><text x="14" y="46" class="muted">схема trader</text></g>
  <line x1="1140" y1="152" x2="1332" y2="152" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="1172" y="140" class="text">читает и пишет</text>
  <text x="1172" y="172" class="proto">[SQL]</text>

  <g transform="translate(1340,262)"><rect width="180" height="60" rx="4" class="store"/>
    <text x="14" y="26" class="svc">Redis</text><text x="14" y="46" class="muted">trader:deal, trader:req</text></g>
  <line x1="1140" y1="292" x2="1332" y2="292" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="1172" y="280" class="text">хранит состояние</text>
  <text x="1172" y="312" class="proto">[Redis]</text>

  <g transform="translate(1340,394)"><rect width="180" height="60" rx="4" class="peer"/>
    <text x="14" y="26" class="svc">core.service.go</text><text x="14" y="46" class="muted">процесс worker</text></g>
  <line x1="1140" y1="424" x2="1332" y2="424" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="1172" y="412" class="text">закрывает сделку</text>
  <text x="1172" y="444" class="proto">[CQRS Payments.Deal.*]</text>

  <g transform="translate(1340,462)"><rect width="180" height="60" rx="4" class="peer"/>
    <text x="14" y="26" class="svc">accounting</text><text x="14" y="46" class="muted">балансы трейдера</text></g>
  <line x1="1140" y1="488" x2="1332" y2="488" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="1172" y="476" class="text">читает баланс</text>
  <text x="1172" y="508" class="proto">[CQRS Accounting.*]</text>
