  <line x1="620" y1="274" x2="664" y2="194" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="620" y1="300" x2="662" y2="300" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="620" y1="452" x2="662" y2="452" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="880" y1="152" x2="922" y2="152" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="880" y1="176" x2="924" y2="256" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="880" y1="316" x2="924" y2="416" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <line x1="880" y1="452" x2="922" y2="452" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <g transform="translate(40,110)"><rect width="200" height="84" rx="4" class="peer"/>
    <text x="14" y="36" class="svc">core.service.go</text><text x="14" y="58" class="muted">manual-адаптер, админка</text></g>
  <line x1="248" y1="152" x2="402" y2="152" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="256" y="140" class="text">просит реквизит</text>
  <text x="256" y="172" class="proto">[CQRS Trader.*]</text>

  <g transform="translate(40,236)"><rect width="200" height="112" rx="4" class="store"/>
    <text x="14" y="30" class="svc">NATS JetStream</text><text x="14" y="54" class="muted">DEAL_EVENTS</text><text x="14" y="72" class="muted">TRADER_BALANCE_EVENTS</text><text x="14" y="90" class="muted">TRADER_SERVICE_DLQ</text></g>
  <line x1="248" y1="268" x2="402" y2="268" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="256" y="256" class="text">шлёт события</text>
  <text x="256" y="286" class="proto">[JetStream]</text>
  <line x1="410" y1="318" x2="248" y2="318" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="256" y="306" class="text">после 3 попыток</text>
  <text x="256" y="342" class="proto">[JetStream DLQ]</text>

  <g transform="translate(40,410)">
    <rect width="200" height="84" fill="#E6EEFC" stroke="#2F6FE0" stroke-width="2.5"/>
    <rect width="200" height="16" fill="#2F6FE0"/>
    <circle cx="12" cy="8" r="3" fill="#fff"/><circle cx="22" cy="8" r="3" fill="#fff"/><circle cx="32" cy="8" r="3" fill="#fff"/>
