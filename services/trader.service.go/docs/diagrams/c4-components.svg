  <g transform="translate(930,110)"><rect width="210" height="84" rx="4" class="comp"/>
    <text x="12" y="24" class="pkg">repo/persistent/postgres</text><text x="12" y="42" class="muted">[репозиторий]</text><text x="12" y="66" class="text">SQL, AES-GCM для value</text></g>
  <g transform="translate(930,250)"><rect width="210" height="84" rx="4" class="comp"/>
    <text x="12" y="24" class="pkg">repo/cache</text><text x="12" y="42" class="muted">[кэш]</text><text x="12" y="66" class="text">карточки, привязки tg</text></g>
  <g transform="translate(930,410)"><rect width="210" height="84" rx="4" class="comp"/>
    <text x="12" y="24" class="pkg">repo/webapi</text><text x="12" y="42" class="muted">[CQRS-клиенты]</text><text x="12" y="66" class="text">core и accounting</text></g>

