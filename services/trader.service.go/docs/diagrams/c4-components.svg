<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 580" font-family="Inter, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#2F6FE0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1A1A1A; }
      .text  { font-size: 13px; }
      .muted { font-size: 12px; fill: #6B6B6B; }
      .proto { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #6B6B6B; }
      .pkg   { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 12px; font-weight: 700; fill: #1A1A1A; }
      .svc   { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 14px; font-weight: 700; fill: #1A1A1A; }
      .comp  { fill: #FFFFFF; stroke: #F6821F; stroke-width: 1; }
      .store { fill: #F1F1F1; stroke: #B5B5B5; stroke-width: 1; }
      .peer  { fill: #E6EEFC; stroke: #2F6FE0; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1560" height="580" fill="#FFFFFF"/>
  <text x="40" y="44" class="title">Компоненты trader.service.go</text>

  <rect x="390" y="66" width="770" height="480" rx="6" fill="#FFFFFF" stroke="#F6821F" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="410" y="92" class="svc">trader.service.go</text>
  <text x="568" y="92" class="muted">[Go-сервис]</text>

  <g transform="translate(410,110)"><rect width="210" height="84" rx="4" class="comp"/>
    <text x="12" y="24" class="pkg">controller/nats_rpc</text><text x="12" y="42" class="muted">[NATS-контроллер]</text><text x="12" y="66" class="text">16 обработчиков Trader.*</text></g>
  <g transform="translate(410,250)"><rect width="210" height="84" rx="4" class="comp"/>
    <text x="12" y="24" class="pkg">controller/nats_event</text><text x="12" y="42" class="muted">[JetStream-консьюмер]</text><text x="12" y="66" class="text">исходы сделок, пополнения</text></g>
  <g transform="translate(410,410)"><rect width="210" height="84" rx="4" class="comp"/>
    <text x="12" y="24" class="pkg">controller/tgbot</text><text x="12" y="42" class="muted">[Telegram-бот]</text><text x="12" y="66" class="text">карточки, кнопки, таймер</text></g>

  <g transform="translate(670,110)"><rect width="210" height="84" rx="4" class="comp"/>
    <text x="12" y="24" class="pkg">usecase/requisite</text><text x="12" y="42" class="muted">[usecase]</text><text x="12" y="66" class="text">выдача и освобождение</text></g>
  <g transform="translate(670,250)"><rect width="210" height="84" rx="4" class="comp"/>
    <text x="12" y="24" class="pkg">usecase/alert</text><text x="12" y="42" class="muted">[usecase]</text><text x="12" y="66" class="text">низкий баланс, пополнение</text></g>
  <g transform="translate(670,410)"><rect width="210" height="84" rx="4" class="comp"/>
