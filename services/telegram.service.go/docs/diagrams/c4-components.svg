<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 750" font-family="Inter, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1A1A1A; }
      .label { font-size: 15px; font-weight: 600; fill: #1A1A1A; }
      .text  { font-size: 13px; fill: #1A1A1A; }
      .verb  { font-size: 13px; fill: #1A1A1A; }
      .muted { font-size: 12px; fill: #6B6B6B; }
      .name  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 14px; font-weight: 700; fill: #1A1A1A; }
      .comp  { fill: #FFFFFF; stroke: #F6821F; stroke-width: 1; }
      .ext   { fill: #E6EEFC; stroke: #2F6FE0; stroke-width: 2; }
      .store { fill: #F1F1F1; }
      .store-name { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px; fill: #444; }
    </style>
  </defs>
  <rect width="1380" height="750" fill="#FFFFFF"/>
  <text x="40" y="44" class="title">Компоненты telegram.service.go</text>

  <rect x="40" y="120" width="150" height="70" rx="6" class="ext"/>
  <text x="54" y="150" class="name">core</text>
  <text x="54" y="172" class="muted">[Go-сервис]</text>
  <rect x="40" y="210" width="150" height="70" rx="6" class="ext"/>
  <text x="54" y="240" class="name">rate.service.go</text>
