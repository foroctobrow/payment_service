  <rect x="330" y="520" width="210" height="70" class="comp"/>
  <text x="344" y="543" class="name">repo/redis</text>
  <text x="344" y="561" class="muted">[репозиторий]</text>
  <text x="344" y="580" class="text">карточки и замки</text>

  <path d="M630 440 H480 V512" fill="none" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
