  <text x="200" y="173" class="muted">[CQRS]</text>
  <line x1="190" y1="245" x2="352" y2="245" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="200" y="235" class="verb">тех-алерт</text>
  <text x="200" y="263" class="muted">[CQRS]</text>

  <g transform="translate(30,0)">
  <rect x="300" y="80" width="760" height="530" rx="6" fill="none" stroke="#F6821F" stroke-width="2" stroke-dasharray="8 6"/>
