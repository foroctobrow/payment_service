  <text x="344" y="202" class="text">разбор и фильтр полей</text>

  <rect x="630" y="120" width="170" height="66" class="comp"/>
  <text x="644" y="143" class="name">usecase/bind</text>
  <text x="644" y="160" class="muted">[usecase]</text>
