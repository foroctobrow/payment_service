  <line x1="680" y1="590" x2="680" y2="664" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="690" y="636" class="verb">ответ, статус</text>
  <text x="690" y="652" class="muted">[CQRS]</text>
  <rect x="600" y="672" width="160" height="50" rx="6" class="ext"/>
  <text x="614" y="702" class="name">core worker</text>

  <line x1="830" y1="590" x2="830" y2="664" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="840" y="636" class="verb">ссылка на файл</text>
  <text x="840" y="652" class="muted">[CQRS]</text>
  <rect x="790" y="672" width="180" height="50" rx="6" class="ext"/>
  <text x="804" y="702" class="name">files.service.go</text>
