  <line x1="800" y1="153" x2="862" y2="153" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="810" y="143" class="verb">шлёт</text>
  <line x1="800" y1="239" x2="862" y2="239" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="810" y="229" class="verb">шлёт</text>

