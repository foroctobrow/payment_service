  <text x="644" y="580" class="text">GetURL, GetStatus, TGRespond</text>
  <line x1="715" y1="460" x2="715" y2="512" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="725" y="492" class="verb">вызывает</text>

  <rect x="1180" y="160" width="150" height="70" rx="6" class="ext"/>
  <text x="1194" y="190" class="label">Telegram</text>
  <text x="1194" y="212" class="muted">[Bot API]</text>
  <line x1="1048" y1="195" x2="1172" y2="195" stroke="#1A1A1A" stroke-width="1.6" marker-start="url(#a-ink)" marker-end="url(#a-ink)"/>
  <text x="1072" y="185" class="verb">сообщения</text>
  <text x="1072" y="213" class="muted">[HTTPS]</text>

  <line x1="435" y1="590" x2="435" y2="664" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="445" y="636" class="verb">хеши и замки</text>
  <text x="445" y="652" class="muted">[Redis]</text>
  <rect x="330" y="672" width="210" height="46" rx="4" class="store"/>
