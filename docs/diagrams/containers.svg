<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#2F6FE0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1A1A1A; }
      .label { font-size: 15px; font-weight: 600; fill: #1A1A1A; }
      .text  { font-size: 14px; }
      .muted { font-size: 12px; fill: #6B6B6B; }
      .mono  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px; fill: #1A1A1A; }
      .name  { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 14px; font-weight: 700; fill: #1A1A1A; }
      .card  { fill: #FFFFFF; stroke: #F6821F; stroke-width: 1.5; }
      .tag rect { fill: #F1F1F1; } .tag text { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #444; }
      .plate { fill: #FFFFFF; stroke: #F6821F; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="44" class="title">Из чего состоит платформа</text>

  <g transform="translate(40,72)">
    <rect width="170" height="56" fill="#F3DDF7" stroke="#9A1FC0" stroke-width="2.5"/><rect width="170" height="14" fill="#9A1FC0"/>
    <text x="14" y="40" class="text">Мерчант</text>
  </g>
  <g transform="translate(40,152)">
    <rect width="170" height="56" fill="#FCE4EC" stroke="#D0305A" stroke-width="2.5"/><rect width="170" height="14" fill="#D0305A"/>
    <text x="14" y="40" class="text">Виджет плательщика</text>
  </g>
  <g transform="translate(40,232)">
    <rect width="170" height="56" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/><rect width="170" height="14" fill="#1A1A1A"/>
    <text x="14" y="40" class="text">Админка</text>
  </g>

  <rect x="300" y="70" width="520" height="236" rx="6" fill="#FFF6EA" stroke="#F6821F" stroke-width="2.5"/>
  <text x="324" y="100" class="name">core.service.go</text>
  <text x="484" y="100" class="muted">монолит, три бинарника</text>
  <rect x="324" y="116" width="150" height="40" class="plate"/><text x="340" y="141" class="mono">merchant-api</text>
  <rect x="324" y="170" width="150" height="40" class="plate"/><text x="340" y="195" class="mono">admin-api</text>
  <rect x="324" y="224" width="150" height="40" class="plate"/><text x="340" y="249" class="mono">worker</text>
  <text x="324" y="288" class="muted">в NATS отвечает под именем worker</text>
  <text x="500" y="141" class="text">сделки и споры</text>
  <text x="500" y="163" class="text">мерчанты, терминалы</text>
  <text x="500" y="185" class="text">провайдеры, роутинг</text>
  <g class="tag" transform="translate(500,240)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g>
  <g class="tag" transform="translate(592,240)"><rect width="52" height="22" rx="3"/><text x="8" y="15">Redis</text></g>
  <g class="tag" transform="translate(652,240)"><rect width="70" height="22" rx="3"/><text x="8" y="15">Temporal</text></g>

  <path d="M210 100 H262 V136 H316" fill="none" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <path d="M210 180 H262 V136" fill="none" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M210 260 H282 V190 H316" fill="none" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <g transform="translate(960,90)">
    <rect width="180" height="90" fill="#E6EEFC" stroke="#2F6FE0" stroke-width="2.5"/><rect width="180" height="14" fill="#2F6FE0"/>
    <text x="14" y="44" class="text">Провайдеры</text>
    <text x="14" y="66" class="muted">BridgePay и другие</text>
  </g>
  <line x1="960" y1="130" x2="828" y2="130" stroke="#2F6FE0" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <line x1="820" y1="160" x2="952" y2="160" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <line x1="560" y1="306" x2="560" y2="330" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="60" y="330" width="1080" height="40" rx="4" fill="#1A1A1A"/>
  <text x="80" y="355" class="mono" fill="#FFFFFF" style="fill:#FFFFFF">NATS · golang-cqrs</text>
  <text x="1120" y="355" class="text" fill="#FFFFFF" text-anchor="end">запросы, команды и события между сервисами</text>

  <g stroke="#1A1A1A" stroke-width="1.6">
    <line x1="160" y1="370" x2="160" y2="400"/><line x1="380" y1="370" x2="380" y2="400"/><line x1="600" y1="370" x2="600" y2="400"/><line x1="820" y1="370" x2="820" y2="400"/><line x1="1040" y1="370" x2="1040" y2="400"/>
    <line x1="270" y1="370" x2="270" y2="520"/><line x1="490" y1="370" x2="490" y2="520"/><line x1="710" y1="370" x2="710" y2="520"/><line x1="930" y1="370" x2="930" y2="520"/>
  </g>

  <g transform="translate(60,400)"><rect width="200" height="96" rx="4" class="card"/>
    <text x="14" y="26" class="name">account</text><text x="14" y="48" class="text">пользователи, JWT, TOTP</text>
    <g class="tag" transform="translate(14,62)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g><g class="tag" transform="translate(104,62)"><rect width="52" height="22" rx="3"/><text x="8" y="15">Redis</text></g></g>
  <g transform="translate(280,400)"><rect width="200" height="96" rx="4" class="card"/>
    <text x="14" y="26" class="name">accounting</text><text x="14" y="48" class="text">леджер и резервы</text>
    <g class="tag" transform="translate(14,62)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g><g class="tag" transform="translate(104,62)"><rect width="76" height="22" rx="3"/><text x="8" y="15">Formance</text></g></g>
  <g transform="translate(500,400)"><rect width="200" height="96" rx="4" class="card"/>
    <text x="14" y="26" class="name">rate</text><text x="14" y="48" class="text">курсы бирж и BridgePay</text>
    <g class="tag" transform="translate(14,62)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g><g class="tag" transform="translate(104,62)"><rect width="52" height="22" rx="3"/><text x="8" y="15">Redis</text></g></g>
  <g transform="translate(720,400)"><rect width="200" height="96" rx="4" class="card"/>
    <text x="14" y="26" class="name">notification</text><text x="14" y="48" class="text">webhook мерчантам</text>
    <g class="tag" transform="translate(14,62)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g><g class="tag" transform="translate(104,62)"><rect width="52" height="22" rx="3"/><text x="8" y="15">Redis</text></g></g>
  <g transform="translate(940,400)"><rect width="200" height="96" rx="4" class="card"/>
    <text x="14" y="26" class="name">trader</text><text x="14" y="48" class="text">реквизиты, бот оператора</text>
    <g class="tag" transform="translate(14,62)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g><g class="tag" transform="translate(104,62)"><rect width="52" height="22" rx="3"/><text x="8" y="15">Redis</text></g></g>

  <g transform="translate(170,520)"><rect width="200" height="96" rx="4" class="card"/>
    <text x="14" y="26" class="name">analytics</text><text x="14" y="48" class="text">отчёты и агрегаты</text>
    <g class="tag" transform="translate(14,62)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g></g>
  <g transform="translate(390,520)"><rect width="200" height="96" rx="4" class="card"/>
    <text x="14" y="26" class="name">platform</text><text x="14" y="48" class="text">справочники</text>
    <g class="tag" transform="translate(14,62)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g><g class="tag" transform="translate(104,62)"><rect width="52" height="22" rx="3"/><text x="8" y="15">Redis</text></g></g>
  <g transform="translate(610,520)"><rect width="200" height="96" rx="4" class="card"/>
    <text x="14" y="26" class="name">telegram</text><text x="14" y="48" class="text">споры и тех-алерты</text>
    <g class="tag" transform="translate(14,62)"><rect width="52" height="22" rx="3"/><text x="8" y="15">Redis</text></g></g>
  <g transform="translate(830,520)"><rect width="200" height="96" rx="4" class="card"/>
    <text x="14" y="26" class="name">files</text><text x="14" y="48" class="text">вложения</text>
    <g class="tag" transform="translate(14,62)"><rect width="84" height="22" rx="3"/><text x="8" y="15">PostgreSQL</text></g><g class="tag" transform="translate(104,62)"><rect width="30" height="22" rx="3"/><text x="8" y="15">S3</text></g></g>
</svg>
